services:
  postgres:
    image: postgres:16
    container_name: storefront-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: storefront
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: storefront-pgweb
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/storefront?sslmode=disable
    ports:
      - "8081:8081"
    command: [ "pgweb", "--bind=0.0.0.0", "--listen=8081" ]

  redis:
    image: redis:7
    container_name: storefront-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]

volumes:
  postgres_data:
  redis_data: